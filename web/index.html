<!-- Apertura: el símbolo se traza, el punto cae al sur y en tres pasos se cuenta qué es SuRoute. Toca para saltar. -->
<div id="intro" class="intro-suroute" role="presentation" aria-hidden="true">
  <div class="in-centro">
    <svg class="in-simbolo" viewBox="0 0 100 100"><path class="in-aro" pathLength="100" d="M41.45 85.53A38 38 0 1 1 58.55 85.53"/><circle class="in-punto" cx="50" cy="86.5" r="6.5"/></svg>
    <p class="in-marca">SuRoute</p><p class="in-lema">Summit Route</p>
    <div class="in-pasos"><span>Escribe tu cumbre</span><span>Da el paso de hoy</span><span>Sube acompañado</span></div>
    <svg class="in-cordillera" viewBox="0 0 260 60"><path class="in-cresta" pathLength="100" d="M0 56L40 40L62 48L104 22L128 34L170 8L196 28L230 18L260 56"/><circle class="in-andante" r="4"/></svg>
  </div>
  <p class="in-saltar">Toca para saltar</p>
</div>
<script>
(function () {
  var el = document.getElementById("intro"), vista = false;
  try { vista = localStorage.getItem("suroute-intro") === "1"; localStorage.setItem("suroute-intro", "1"); } catch (e) {}
  if (vista || /[#&]p=/.test(location.hash)) el.classList.add("corta");
  var fin = function () { if (el.parentNode) el.parentNode.removeChild(el); };
  var salir = function () { el.classList.add("salir"); setTimeout(fin, 260); };
  el.addEventListener("click", salir);
  addEventListener("keydown", function (e) { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") salir(); }, { once: true });
  el.addEventListener("animationend", function (e) { if (e.target === el) fin(); });
  setTimeout(fin, el.classList.contains("corta") ? 900 : 6000);
})();
</script>
<div class="franja" aria-hidden="true"></div>
<section id="pantallaCarta" class="carta-pantalla" hidden></section>
<section id="pantallaVincular" class="vincular" hidden></section>
<div id="pantallaCarga" class="cargando" hidden></div>
<div id="pantallaApp" class="ventana" hidden>
  <script>
  /* Ampliar la pantalla para trabajar con más espacio, o volver al tamaño normal (se recuerda) */
  (function () {
    var v = document.getElementById("pantallaApp");
    function poner(t, guardar) {
      v.classList.toggle("amplia", t === "amplia");
      // el botón cambia de ícono y de nombre sin redibujar la pantalla
      if (typeof ic === "function") document.querySelectorAll(".tam-cab").forEach(function (b) {
        var amplia = t === "amplia", txt = amplia ? "Volver al tamaño normal" : "Ampliar la pantalla";
        b.dataset.tam = amplia ? "normal" : "amplia"; b.title = txt; b.setAttribute("aria-label", txt); b.innerHTML = ic(amplia ? "salirPantalla" : "pantallaCompleta");
      });
      if (guardar) try { localStorage.setItem("suroute-tam", t); } catch (e) {}
    }
    var t = "normal"; try { t = localStorage.getItem("suroute-tam") || "normal"; } catch (e) {}
    poner(t, false);
    document.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest("[data-tam]"); if (b) poner(b.dataset.tam, true); });
  })();
  </script>

</div>
