# Publica RutaCima Web en GitHub Pages cada vez que cambia la web (o a mano desde Actions).
# Una sola vez: Settings › Pages › Source: "GitHub Actions".
# Para conectarla a tu servidor: Settings › Secrets and variables › Actions › Variables:
#   RUTACIMA_SUPABASE_URL y RUTACIMA_SUPABASE_ANON_KEY (la clave anon es pública por diseño).
name: Publicar RutaCima Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/src/main/assets/content/**"
      - "app/src/main/assets/frases/**"
      - "tools/armar_web.sh"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        env:
          SUPABASE_URL: ${{ vars.RUTACIMA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.RUTACIMA_SUPABASE_ANON_KEY }}
        run: bash tools/armar_web.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
