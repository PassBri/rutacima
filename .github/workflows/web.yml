# Publica Rutaalacima Web en GitHub Pages (rama gh-pages) cada vez que cambia la web, o a mano desde Actions.
# La web queda en https://passbri.github.io/rutacima/
# Para conectarla a tu servidor: Settings › Secrets and variables › Actions › Variables:
#   RUTACIMA_SUPABASE_URL y RUTACIMA_SUPABASE_ANON_KEY (la clave anon es pública por diseño).
# Sin ellas, la web abre en modo demostración.
name: Publicar Rutaalacima Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/src/main/assets/content/**"
      - "app/src/main/assets/frases/**"
      - "app/src/main/assets/audios/**"
      - "diseno/video/**"
      - "tools/armar_web.sh"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        env:
          SUPABASE_URL: ${{ vars.RUTACIMA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.RUTACIMA_SUPABASE_ANON_KEY }}
          PLAN_PRECIO_MES: ${{ vars.RUTACIMA_PLAN_PRECIO_MES }}
          PLAN_PRECIO_ANIO: ${{ vars.RUTACIMA_PLAN_PRECIO_ANIO }}
        run: bash tools/armar_web.sh _site
      - name: Subir a la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica Rutaalacima Web (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
